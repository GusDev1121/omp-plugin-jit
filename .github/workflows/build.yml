name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # The project and its vendored deps declare cmake_minimum_required < 3.5,
  # which CMake 4 rejects without this.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe → plugin version
      - name: Configure
        run: cmake -S . -B build -A Win32 -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build --config Release --target jit
      - uses: actions/upload-artifact@v4
        with:
          name: jit-win32
          path: build/Release/jit.dll
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build in Ubuntu 18.04 (glibc 2.27)
        # Same base as open.mp and streamer, so jit.so loads on any distro with glibc >= 2.27.
        # Plain docker run, not `container:` — Node 20 actions can't run on 18.04's glibc.
        # Root CMakeLists.txt adds -m32; open.mp and SA-MP servers are 32-bit.
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e DEBIAN_FRONTEND=noninteractive ubuntu:18.04 sh -ec '
            apt-get update -q
            apt-get install -y -q cmake make g++-multilib git
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build . --target jit -- -j"$(nproc)"'
      - name: Check binary is 32-bit
        run: file build/jit.so | tee /dev/stderr | grep -q 'ELF 32-bit'
      - name: Check runtime requirements (no libstdc++, glibc <= 2.27)
        run: |
          if objdump -T build/jit.so | grep GLIBCXX; then echo "jit.so needs libstdc++"; exit 1; fi
          max=$(objdump -T build/jit.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "::notice title=jit.so glibc::requires $max"
          [ "$(printf '%s\nGLIBC_2.27\n' "$max" | sort -V | tail -1)" = GLIBC_2.27 ]
      - uses: actions/upload-artifact@v4
        with:
          name: jit-linux
          path: build/jit.so
          if-no-files-found: error

  glibc-compat:
    # Resolves jit.so's symbols (ldd -r, same as the server's dlopen) on 32-bit distros.
    # Only glibc >= 2.27 must pass; older ones are reported, not failed.
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jit-linux
      - name: Try loading on each glibc
        run: |
          set +e # a failing distro is a result to report, not a script error
          fail=0
          for img in i386/debian:8 i386/ubuntu:16.04 i386/debian:9 i386/ubuntu:18.04 i386/debian:10 i386/debian:12; do
            docker pull -q "$img" >/dev/null
            out=$(docker run --rm -v "$PWD:/p" "$img" sh -c 'ldd --version | head -1; ldd -r /p/jit.so' 2>&1)
            glibc=$(echo "$out" | grep -m1 '^ldd' | grep -o '[0-9]\.[0-9]*$')
            if echo "$out" | grep -q 'not found'; then res=FAIL; else res=OK; fi
            echo "::group::$img (glibc $glibc): $res"; echo "$out"; echo "::endgroup::"
            echo "::notice title=$img::glibc $glibc $res. $(echo "$out" | grep -E 'not found|libc.so' | head -3 | tr '\n' ' ')"
            echo "| $img | $glibc | $res |" >> rows
            if [ $res = FAIL ] && [ "$(printf '%s\n2.27\n' "$glibc" | sort -V | head -1)" = 2.27 ]; then fail=1; fi
          done
          { echo "| image | glibc | jit.so |"; echo "|---|---|---|"; cat rows; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $fail

  omp-linux:
    # jit.so as a legacy plugin on a real open.mp Linux server (32-bit container).
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jit-linux
          path: dist
      - name: Fetch open.mp server and pawncc
        run: |
          curl -sSL https://github.com/openmultiplayer/open.mp/releases/download/v1.6.7.3218/open.mp-linux-x86.tar.gz | tar xz
          curl -sSL https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz | tar xz
          srv=$(dirname "$(find . -name omp-server -type f | head -1)")
          echo "SERVER_DIR=$srv" >> "$GITHUB_ENV"
          echo "::notice title=open.mp server dir::$srv"
      - name: Run gamemode with JIT
        run: |
          set +e
          fail=0
          for flags in "-d3" "-d0 -O2" "-d3 -O2"; do
            # omp-server needs libatomic, which the base image lacks.
            docker run --rm -v "$PWD:/w" -w /w i386/debian:12 sh -c \
              'apt-get update -qq >/dev/null && apt-get install -y -qq libatomic1 >/dev/null && sh tests/omp_linux/run.sh "$@"' \
              _ dist/jit.so pawnc-3.10.10-linux "$SERVER_DIR" $flags > out.txt 2>&1
            r=$?
            echo "::group::pawncc $flags (exit $r)"; cat out.txt; echo "::endgroup::"
            if [ $r -eq 0 ]; then
              echo "::notice title=open.mp linux $flags::OK"
            else
              fail=1
              echo "::error title=open.mp linux $flags (exit $r)::$(grep -E '\[jit\]|smoke|rror|JIT plugin' out.txt | head -12 | tr '\n' '|')"
              echo "::notice title=disasm $flags::$(sed -n '/^--- disassembly/,$p' out.txt | head -30 | tr '\n' '|')"
            fi
          done
          exit $fail

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jit-win32/jit.dll
            dist/jit-linux/jit.so
          generate_release_notes: true
