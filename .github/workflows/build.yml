name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  # The project and its vendored deps declare cmake_minimum_required < 3.5,
  # which CMake 4 rejects without this.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe → plugin version
      - name: Configure
        run: cmake -S . -B build -A Win32 -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build --config Release --target jit
      - uses: actions/upload-artifact@v4
        with:
          name: jit-win32
          path: build/Release/jit.dll
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-multilib g++-multilib
      - name: Configure
        # Root CMakeLists.txt adds -m32; open.mp and SA-MP servers are 32-bit.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build build --target jit -j
      - name: Check binary is 32-bit
        run: file build/jit.so | tee /dev/stderr | grep -q 'ELF 32-bit'
      - uses: actions/upload-artifact@v4
        with:
          name: jit-linux
          path: build/jit.so
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jit-win32/jit.dll
            dist/jit-linux/jit.so
          generate_release_notes: true
